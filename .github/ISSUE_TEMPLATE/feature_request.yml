name: Feature request
description: Suggest a new feature or product improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea.

        Please describe the problem and the expected result as concretely as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Add a command to export the current thread history
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve, or what user need does this feature address?
      placeholder: I want to archive a thread outside IM so I can review it later
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the feature you want and how it should work from a user perspective.
      placeholder: Add a /export command that saves the current thread as a markdown file
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If you already considered another workaround or solution, describe it here.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any extra notes, screenshots, examples, or constraints.
